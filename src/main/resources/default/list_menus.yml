title: 'Menus &0[{{page get}}/{{page max}}]'

layout: |-
  ####*####
  |       |
  |       |
  |       |
  <#######>

events:
  post_open:
    context set pitch to 0

bindings:
 command:
   name: 'menus'
   permission: 'menus.list'
   usage: '/menus <filter>'

generator:
  source: menu
  sortBy: id
  filter: |-
    any [ 
      ctx without filter
      check &element_id[lower] has &filter[lower]
    ]
  output:
    material: paper
    name: '&a&l{{&element_id}}'
    lore: |-
      &r
      &8· &fRows: &a{{element *rows}}
      &8· &fType: &3{{element *type}}
      &8· &fVirtual: &e{{element *virtual}}
      &r
      &b→ &6Click to open
    sub:
      - if: check &last_previewed == &element_id
        glow: true
    action: |-
      menu close
      sleep 0.2s
      menu open element id

icons:
  '#':
    material: green stained glass pane
    name: '&8...'
  '|':
    material: gray stained glass pane
    name: '&8...'

  '*':
    material: sign
    name: '&6Elements Filter'
    lore: |-
      &r
      &7Filter: &e{{&filter}}
      &8(left click to set / right click remove)
      &r
    action:
      left:
        catch: filter
        signIndex: -1
        cancel: [ 'exit', 'cancel' ]
      right: context del filter regenerate icons refresh menu title update

  '>':
    material: black stained glass pane
    name: '&8...'
    lore: '{{page current}} / {{page max}}'
    sub:
      - if: not page isLast
        material: lime stained glass pane
        name: '&aNext page →'
        action: |-
          page next
          icons refresh
          menu title update
  '<':
    material: black stained glass pane
    name: '&8...'
    lore: '{{page current}} / {{page max}}'
    sub:
      - if: not page isFirst
        material: cyan stained glass pane
        name: '&b← Previous page'
        action: |-
          page previous
          icons refresh
          menu title update
